global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - "alert_rules.yml"

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Document System Gateway
  - job_name: 'document-gateway'
    static_configs:
      - targets: ['fastapi-gateway:8001']
    scrape_interval: 5s
    metrics_path: /metrics
    scrape_timeout: 10s

  # OCR Pipeline
  - job_name: 'ocr-pipeline'
    static_configs:
      - targets: ['ocr-pipeline:8001']
    scrape_interval: 5s
    metrics_path: /metrics

  # VLM Pipeline
  - job_name: 'vlm-pipeline'
    static_configs:
      - targets: ['vlm-pipeline:8001']
    scrape_interval: 5s
    metrics_path: /metrics

  # MLflow
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    scrape_interval: 30s

  # Node Exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker Exporter
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']